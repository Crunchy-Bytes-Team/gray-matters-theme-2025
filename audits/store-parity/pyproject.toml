[build-system]
requires = [
  "setuptools==75.8.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "store-parity"
version = "0.1.0"
description = "Deterministic full-store UI/UX parity audit foundation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "Jinja2==3.1.5",
  "Pillow==11.1.0",
  "PyYAML==6.0.2",
  "axe-playwright-python==0.1.8",
  "jsonschema==4.23.0",
  "playwright==1.49.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
]

[project.scripts]
store-parity = "store_parity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
